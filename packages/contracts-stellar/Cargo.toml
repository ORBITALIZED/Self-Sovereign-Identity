[package]
name = "ssi-contracts-stellar"
version = "0.1.0"
edition = "2021"
authors = ["SSI contributors"]
description = "Self-Sovereign Identity — Soroban smart contracts"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=21.7.7"

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }
# `soroban-env-host` depends on `ed25519-dalek >=2.0.0` (resolving to 3.x, which
# uses rand_core 0.10) but seeds it with `rand_chacha 0.3.1` (rand_core 0.6),
# which breaks `SigningKey::generate` and therefore `cargo test --features
# testutils`. The committed Cargo.lock pins ed25519-dalek to 2.2.0 (rand_core
# 0.6) so the whole graph shares one rand_core. If the lockfile is ever
# regenerated, re-apply: `cargo update -p ed25519-dalek --precise 2.2.0`.
# This dev-dep is also used directly to mint the proof-of-ownership signatures
# exercised by the access-control tests in src/test.rs.
ed25519-dalek = "=3.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true

[profile.test]
opt-level = 0

# -----------------------------------------------------------------------------
# Workspace lint configuration
# -----------------------------------------------------------------------------
# Tighten clippy just enough to catch real issues without breaking the
# existing module surface. New Lints are added sparingly to avoid churn
# in unrelated modules.
[lints.clippy]
correctness = { level = "deny", priority = -1 }
# The `suspicious` group fires on existing code (panic! / expect / unwrap_used);
# the CI `cargo clippy --all-targets -- -D warnings` step would turn those into
# errors. Keep `suspicious` at allow until each offender is cleaned up.
suspicious = "allow"
# Allow-by-default noisy warnings that fire on Soroban SDK boilerplate.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
